name: 'Life Countdown'
description: 'Generate a beautifully themed life countdown SVG for your GitHub profile README'
author: 'chengxilo'

inputs:
  death_date:
    description: 'Target end-of-life date (YYYY-MM-DD)'
    required: true
  theme:
    description: 'Visual theme: default | tokyo-night | react | react-dark | dracula | nord | github-dark'
    required: false
    default: 'default'
  output_path:
    description: 'Output path for the generated SVG'
    required: false
    default: 'assets/life-countdown.svg'

runs:
  using: 'composite'
  steps:
    - name: Generate life countdown SVG
      shell: bash
      run: python3 "${{ github.action_path }}/generate.py"
      env:
        DEATH_DATE:   ${{ inputs.death_date }}
        THEME:        ${{ inputs.theme }}
        OUTPUT_PATH:  ${{ inputs.output_path }}

branding:
  icon: 'clock'
  color: 'blue'

name: Countdown

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  push:
    paths:
      - '.github/workflows/countdown.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: chengxilo/countdown@main
        with:
          date: '2084-08-10'              # your target date
          label: 'DAYS REMAINING'         # customize freely
          theme: 'tokyo-night'            # see README for all themes
          output_path: 'assets/countdown.svg'

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/countdown.svg
          git diff --staged --quiet || git commit -m "chore: update countdown"
          git push

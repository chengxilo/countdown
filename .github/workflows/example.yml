name: Life Countdown

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  push:
    paths:
      - '.github/workflows/life-countdown.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: chengxilo/life-countdown@main
        with:
          death_date: '2084-08-10'   # your target date
          theme: 'tokyo-night'       # see README for all themes
          output_path: 'assets/life-countdown.svg'

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/life-countdown.svg
          git diff --staged --quiet || git commit -m "chore: update life countdown"
          git push
